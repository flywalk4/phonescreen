name: PhoneScreen
options:
  bundleIdPrefix: com.flywalk4.phonescreen
  deploymentTarget:
    macOS: "14.0"
    iOS: "18.0"
  createIntermediateGroups: true
  # Russian UI: dates, weekdays and relative times format in Russian.
  developmentLanguage: ru

packages:
  PhoneScreenKit:
    path: Packages/PhoneScreenKit

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Set DEVELOPMENT_TEAM in the environment (or in Xcode) to run on a real iPhone.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic

targets:
  PhoneScreenMac:
    type: application
    platform: macOS
    sources: [Mac]
    dependencies:
      - package: PhoneScreenKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flywalk4.phonescreen.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: PhoneScreen
        # Local-only distribution: no sandbox (needs usbmuxd socket, AppleScript, later CGEventTap).
        ENABLE_HARDENED_RUNTIME: NO
        # A real identity (not ad-hoc) keeps the Accessibility grant across rebuilds.
        CODE_SIGN_IDENTITY: "Apple Development"
        # Private CGVirtualDisplay classes for the second screen.
        SWIFT_OBJC_BRIDGING_HEADER: Mac/Display/CGVirtualDisplay.h
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: PhoneScreen
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "PhoneScreen читает текущий трек, заметки и команды и показывает их на iPhone."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "PhoneScreen находит iPhone в локальной сети и по прямому Wi-Fi."
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Запасной канал связи с iPhone, когда нет кабеля и Wi-Fi."
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Mac/Info.plist
      properties:
        NSBonjourServices: [_phonescreen._tcp]

  PhoneScreeniOS:
    type: application
    platform: iOS
    sources: [iOS]
    dependencies:
      - package: PhoneScreenKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flywalk4.phonescreen.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: PhoneScreen
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PhoneScreen
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        # The app stays portrait; OrientedContainer rotates the UI itself — from the accelerometer when the phone
        # is held up (MotionOrientation), from the Mac arrangement when it lies flat.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "PhoneScreen принимает подключение от Mac по Wi-Fi и напрямую."
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Запасной канал связи с Mac, когда нет кабеля и Wi-Fi."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Показывает и отмечает ваши напоминания на экране рядом с Mac."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Показывает повестку дня из вашего календаря."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Нужна для прогноза погоды там, где вы находитесь."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Показывает ваши избранные фото слайд-шоу на экране рядом с Mac."
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: iOS/Info.plist
      properties:
        NSBonjourServices: [_phonescreen._tcp]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
