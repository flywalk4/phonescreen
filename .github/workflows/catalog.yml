name: Catalog

on:
  pull_request:
    paths: ["catalog/**", "scripts/**", "schemas/**", "Mac/Widgets/prelude.js"]
  push:
    branches: [main]
    paths: ["catalog/**", "scripts/**", "schemas/**", "Mac/Widgets/prelude.js"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate widgets and themes
        run: |
          for w in catalog/widgets/*/; do python3 scripts/validate-widget.py "$w"; done
          for t in catalog/themes/*/; do python3 scripts/validate-theme.py "$t"; done
      - name: catalog/index.json and schemas/ are up to date
        run: |
          python3 scripts/build-catalog.py --check
          python3 scripts/build-schemas.py --check
      - name: The starter template works
        run: |
          node scripts/widget-dev.mjs new com.ci.starter --dir "$RUNNER_TEMP"
          python3 scripts/validate-widget.py "$RUNNER_TEMP/com.ci.starter"
          node scripts/widget-dev.mjs test "$RUNNER_TEMP/com.ci.starter"
      - name: Widget scenarios (fixtures/)
        run: node scripts/widget-dev.mjs test
